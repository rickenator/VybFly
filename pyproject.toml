[project]
name = "flyscale"
version = "0.0.1"
description = "FlyScale: geometric upscaling of the Drosophila connectome (PROJECT-VYBFLY.md)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "pyarrow>=16",
    "networkx>=3.2",
    "igraph>=0.11",
    "leidenalg>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
vision = ["torch>=2.3", "torchvision>=0.18", "matplotlib>=3.8", "scikit-learn>=1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
